name: Catalogue domains resolve

# Flags catalogue domains that stopped resolving (scripts/check-catalogue-resolves.py).
# On a schedule, not on every pull request: the catalogue is best effort, and DNS that changes
# under a pull request must not block it. A red run is a reason to look at the listed
# names, nothing more. Pull requests that change the check itself run it too, so a broken
# check shows there.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/catalogue-resolves.yml
      - scripts/check-catalogue-resolves.py

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dig
        run: command -v dig || (sudo apt-get update && sudo apt-get install -y dnsutils)
      - run: python3 scripts/check-catalogue-resolves.py
