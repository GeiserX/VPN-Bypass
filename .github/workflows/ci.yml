name: CI

on:
  workflow_dispatch:
  # No paths filter on push to main: release.yml publishes a commit only when this
  # workflow's jobs are green on that exact commit, and auto-tag.yml tags commits that
  # touch files outside any Swift-only filter (Info.plist, Makefile, assets/**), so every
  # commit on main needs its own run.
  push:
    branches: [main]
  # No paths filter on PRs: `test` is a required status check in the "Protect
  # main" ruleset, so it MUST report on every PR — a path-filtered run that is
  # skipped never reports and blocks the PR forever.
  pull_request:
    branches: [main]

# Pull requests: one run per PR, a new push cancels the old run. Main: one group per
# commit, so a quick second merge can never cancel (or replace while pending) the run
# the first commit's release is waiting on.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted macOS runners are free + unlimited on public repos, and being
    # throwaway VMs they remove the self-hosted fork-PR attack surface entirely
    # (so no fork guard is needed). They ship full Xcode, so XCTest is available.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Don't leave the GitHub token in local git config while running
          # PR-controlled code (`swift test`) — fork PRs now run here.
          persist-credentials: false
      - name: Select Xcode (latest stable)
        # Full Xcode ships XCTest and a Swift 6 compiler (the code uses `sending`).
        # The action selects reliably across images (no non-portable `sort -V`).
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify XCTest is available
        run: xcrun --find xctest
      - name: Cache SPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - run: swift test --enable-code-coverage
      - name: Check translations
        # Every localizable string in Sources/ needs a Spanish and a French entry. The keys come
        # from the compiler (a separate build of VPNBypassCore in a temp dir, so a cached .build
        # cannot feed it stale keys).
        run: python3 scripts/check-localizations.py
      - name: Build privileged helper
        # The helper isn't part of the SPM package (it's compiled by the Makefile with
        # a bridging header for the XPC audit token), so `swift test` doesn't cover it.
        # Build it here so a helper/bridging-header regression is caught on every PR.
        run: make build-helper
      - name: Convert coverage
        run: |
          BIN=$(find .build -path '*.xctest/Contents/MacOS/*' -type f ! -path '*.dSYM*' | head -1)
          xcrun llvm-cov export "$BIN" -instr-profile .build/debug/codecov/default.profdata -format lcov > coverage.lcov
      - uses: codecov/codecov-action@v7
        if: github.event_name == 'push'
        with:
          files: coverage.lcov
          fail_ci_if_error: false

  app:
    # The job name is the check name: release.yml waits for it on the release commit, and
    # the "Protect main" ruleset requires it. Rename all three together.
    name: build and launch app
    # Public repo: GitHub-hosted macOS is free here and a throwaway VM, so PR code never
    # touches a self-hosted runner.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The Makefile stamps the version from the last tag (git describe).
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build the app bundle
        # The same `make bundle` that `make release` signs and packs into the DMG: the
        # universal release build of the app and vpnb, plus the privileged helper.
        run: make bundle
      - name: Check the binaries are universal
        run: |
          for f in "VPN Bypass.app/Contents/MacOS/VPNBypass" \
                   "VPN Bypass.app/Contents/MacOS/vpnb" \
                   "VPN Bypass.app/Contents/MacOS/com.geiserx.vpnbypass.helper"; do
            archs=$(lipo -archs "$f")
            echo "$f: $archs"
            case " $archs " in *" arm64 "*) ;; *) echo "::error::$f has no arm64 slice"; exit 1 ;; esac
            case " $archs " in *" x86_64 "*) ;; *) echo "::error::$f has no x86_64 slice"; exit 1 ;; esac
          done
      - name: Launch the built app
        run: scripts/smoke-launch.sh "VPN Bypass.app"
