name: CDN ranges current

# Flags a bundled CDN range list (Sources/VPNBypassCore/CDNRangeList.swift) that no longer
# matches what Cloudflare, Fastly and CloudFront publish (scripts/update-cdn-ranges.py
# --check). On a schedule, not on every pull request: the CDNs change their lists on their
# own time. A red run means: run scripts/update-cdn-ranges.py and commit the file it writes.
# Pull requests that change the check itself run it too, so a broken check shows there.
on:
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cdn-ranges.yml
      - scripts/update-cdn-ranges.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/update-cdn-ranges.py --check
