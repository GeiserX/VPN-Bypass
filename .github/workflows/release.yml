name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.0)'
        required: true
        type: string

# Serialize ALL release runs with a single global group. A tag push and a manual/auto-tag
# dispatch can target the same version but land on different refs AND differ in the `v`
# prefix (tag `github.ref_name` = `v3.1.3` vs. dispatch input `3.1.3`), so any version-keyed
# group would let those two race on the shared Homebrew-tap push. A global group makes every
# release run wait for the previous one — releases are infrequent and the tap push is a shared
# resource, so serializing them all is correct. cancel-in-progress: false — never abort an
# in-flight release mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest  # free + unlimited on public repos; ships full Xcode for the universal build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"

      - name: Update Info.plist version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Info.plist

      # The helper only accepts an app signed by our Developer ID team, so a release must
      # never fall back to ad-hoc: a missing secret fails here, and the signing script
      # (scripts/sign-and-notarize.sh) fails on any it needs.
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            [ -n "${!name}" ] || { echo "::error::secret $name is not set"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q "$APPLE_SIGNING_IDENTITY" \
            || { echo "::error::the certificate holds no codesigning identity $APPLE_SIGNING_IDENTITY"; exit 1; }

      - name: Build, sign and notarize release
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: make release

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Calculate SHA256
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA256=$(shasum -a 256 "dist/VPN-Bypass-$VERSION.dmg" | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "📝 SHA256: $SHA256"

      - name: Generate changelog
        id: changelog
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          VERSION="v$VERSION_NUMBER"
          PREV_TAG=$(git tag -l "v*" --sort=-version:refname | sed -n '2p')
          
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          
          echo "📝 Generating changelog from $PREV_TAG to $VERSION"
          
          {
            echo "## What's Changed"
            echo ""
            
            # Features
            FEATURES=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" --grep="^feat" 2>/dev/null || true)
            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              echo "$FEATURES" | head -20
              echo ""
            fi
            
            # Fixes
            FIXES=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" --grep="^fix" 2>/dev/null || true)
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES" | head -20
              echo ""
            fi
            
            # Other changes
            OTHERS=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" --invert-grep --grep="^feat" --invert-grep --grep="^fix" 2>/dev/null | head -10 || true)
            if [ -n "$OTHERS" ]; then
              echo "### 🔧 Other Changes"
              echo "$OTHERS"
              echo ""
            fi
            
            echo "---"
            echo ""
            echo "## Installation"
            echo ""
            echo "### Homebrew (recommended)"
            echo '```bash'
            echo "brew tap GeiserX/vpn-bypass"
            echo "brew install --cask vpn-bypass"
            echo '```'
            echo ""
            echo "### Manual Download"
            echo "Download \`VPN-Bypass-$VERSION_NUMBER.dmg\` from the assets below."
            echo ""
            echo "---"
            echo ""
            echo "**SHA256:** \`$SHA256\`"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$VERSION"
          } > changelog.md
          
          cat changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "VPN Bypass v${{ steps.version.outputs.version }}"
          body_path: changelog.md
          draft: false
          prerelease: false
          files: |
            dist/VPN-Bypass-${{ steps.version.outputs.version }}.dmg

      - name: Update Homebrew Cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          # Clone homebrew tap
          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/GeiserX/homebrew-vpn-bypass.git" homebrew-tap
          cd homebrew-tap
          
          # Update cask file
          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/vpn-bypass.rb 2>/dev/null || \
          sed -i "s/version \".*\"/version \"$VERSION\"/" Casks/vpn-bypass.rb
          
          sed -i '' "s/sha256 \".*\"/sha256 \"$SHA256\"/" Casks/vpn-bypass.rb 2>/dev/null || \
          sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" Casks/vpn-bypass.rb

          # Ensure the `binary` stanza is present so `vpnb` is symlinked onto PATH by
          # `brew install --cask`. It MUST be rooted at #{appdir}: Homebrew moves the
          # .app to /Applications BEFORE linking, so a relative source would resolve to
          # the emptied staging dir and abort the whole install (CaskError: source not
          # there). The seds above only rewrite version/sha256, so a tap cask predating
          # this change never otherwise gains the stanza. grep-guard = idempotent; #{...}
          # is literal in a Perl replacement (only $ and @ interpolate), so it reaches the
          # cask verbatim for Ruby to interpolate at install time.
          grep -q 'Contents/MacOS/vpnb' Casks/vpn-bypass.rb || \
            perl -0777pi -e 's{(app "VPN Bypass\.app"\n)}{$1  binary "#{appdir}/VPN Bypass.app/Contents/MacOS/vpnb"\n}' Casks/vpn-bypass.rb
          # Fail the release loudly if the app anchor moved and the insert silently no-op'd
          # (otherwise vpnb would just never appear on PATH, with no error).
          grep -q 'Contents/MacOS/vpnb' Casks/vpn-bypass.rb || { echo "::error::vpnb binary stanza not inserted into the tap cask (app anchor not found)"; exit 1; }

          # The cask has no preflight or postflight. The old ones quit the app before an
          # upgrade and tried to reopen it after, but Homebrew runs install steps in a sandbox
          # that forbids launching an app (`deny lsopen`), so the app stayed closed with every
          # route removed. The app now restarts itself when its bundle is replaced
          # (AppUpdateRelauncher), which needs it left running. A step that re-signs the app
          # or clears quarantine would also break it: the helper accepts only our team's
          # signature. Idempotent, and the release fails if any such step survives.
          perl -0777pi -e 's{  (?:pre|post)flight(?:_steps)? do\n.*?\n  end\n\n?}{}gs' Casks/vpn-bypass.rb
          if grep -qE 'flight|terminate_process|/usr/bin/open|codesign|xattr' Casks/vpn-bypass.rb; then
            echo "::error::tap cask still has a preflight or postflight step"; cat Casks/vpn-bypass.rb; exit 1
          fi

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/vpn-bypass.rb
          git diff --staged --quiet || git commit -m "Update vpn-bypass to v$VERSION"
          git push
          
          echo "✅ Homebrew cask updated to v$VERSION"
          
          echo "## 🍺 Homebrew Cask Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**SHA256:** $SHA256" >> $GITHUB_STEP_SUMMARY
