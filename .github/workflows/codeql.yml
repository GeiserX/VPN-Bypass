name: CodeQL

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: swift
      - uses: github/codeql-action/autobuild@v4.37.9
      - uses: github/codeql-action/analyze@v4.37.9
