<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="sq"><rect width="1024" height="1024" rx="230" ry="230"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2B2470"/><stop offset="100%" stop-color="#0E0B24"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- userSpaceOnUse is REQUIRED: an objectBoundingBox gradient has a degenerate box on a
         zero-height path (a horizontal line) and paints nothing at all. -->
    <linearGradient id="mk" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <circle cx="820" cy="180" r="300" fill="#A78BFA" opacity="0.10"/>
  </g>
  <g transform="translate(182.8,178.7) scale(27.434)">
  <path d="M7 20 V13.5 A5 5 0 0 1 17 13.5 V20 Z" fill="url(#mk)"/>
  <g fill="none" stroke="url(#mk)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 20 V9 C2 4 22 4 22 9 V20"/>
  </g></g>
</svg>