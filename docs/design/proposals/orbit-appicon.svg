<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="sq"><rect width="1024" height="1024" rx="230" ry="230"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0B4F47"/><stop offset="100%" stop-color="#04201D"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- userSpaceOnUse is REQUIRED: an objectBoundingBox gradient has a degenerate box on a
         zero-height path (a horizontal line) and paints nothing at all. -->
    <linearGradient id="mk" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <circle cx="820" cy="180" r="300" fill="#5EEAD4" opacity="0.10"/>
  </g>
  <g transform="translate(180.9,187.9) scale(28.182)">
  <circle cx="12" cy="12.5" r="4.4" fill="url(#mk)"/>
  <g fill="none" stroke="url(#mk)" stroke-width="2.6" stroke-linecap="round">
    <path d="M2.5 20 C10 23.5 21 20 21 12.5 C21 7 17 4 12.5 4 C10 4 8 4.8 6.5 6"/>
    <path d="M7.2 1.8 L6 6.6 L10.8 5.6"/>
  </g></g>
</svg>